name: Roll back website files

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Full commit SHA containing the last known-good public/ website'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: website-public-main
  cancel-in-progress: false

jobs:
  restore:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out full main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Run infrastructure unit tests
        run: |
          python -m unittest discover -s tests -v
          node --test tests/contact-function.test.mjs

      - name: Restore public files from selected commit
        env:
          TARGET_COMMIT: ${{ inputs.target_commit }}
        shell: bash
        run: |
          if ! [[ "$TARGET_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The target must be a full 40-character commit SHA." >&2
            exit 1
          fi
          git cat-file -e "${TARGET_COMMIT}^{commit}"
          git merge-base --is-ancestor "$TARGET_COMMIT" HEAD
          # restore removes tracked files absent from the selected old tree too.
          git restore --source="$TARGET_COMMIT" --staged --worktree -- public

      - name: Validate restored production website
        shell: bash
        run: |
          set +e
          python scripts/validate_site.py public \
            --mode production \
            --repo-root . \
            --report-json .rollback-validation.json \
            --report-md .rollback-validation.md
          status=$?
          cat .rollback-validation.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Commit the rollback
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ inputs.target_commit }}
        shell: bash
        run: |
          if git diff --quiet HEAD -- public; then
            echo "The selected public/ files already match main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "Website Rollback Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public
          git commit -m "Roll back website to ${TARGET_COMMIT:0:12}"
          # Fail on a concurrent main change. Replaying stale public/ over a newer
          # website or rollback could overwrite the owner's approved update.
          git -c credential.helper='!f() { printf "username=x-access-token\npassword=%s\n" "$GH_PUSH_TOKEN"; }; f' push origin HEAD:main
